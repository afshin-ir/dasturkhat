name: Build LibreOffice OXT

on:
  push:
    branches:
      - codex/dastur-khat-preferred-orthography
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-oxt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build the LibreOffice extension
        run: |
          mkdir -p build
          make libreoffice
      - name: Upload the OXT package
        uses: actions/upload-artifact@v4
        with:
          name: lilak-fa-IR-oxt
          path: build/fa-IR-dictionary.oxt
          if-no-files-found: error
          retention-days: 14
